[package]
name = "uf-crsf"
version = "0.6.0"
edition = "2021"
rust-version = "1.87.0"

description = "A `no_std` Rust library for parsing the TBS Crossfire protocol, designed for embedded environments"
categories = ["embedded", "no-std"]
authors = ["Nickolai Novik <nickolainovik@gmail.com>"]
license = "Apache-2.0"
homepage = "https://github.com/jettify/uf-crsf"
repository = "https://github.com/jettify/uf-crsf"
readme = "README.md"

[dependencies]
crc = "3.3.0"
defmt = { version = "1.0.1", optional = true }
heapless = "0.9.1"
libm = { version = "0.2.15", optional = true }
log = { version = "0.4", optional = true, default-features = false }
num_enum = { version = "0.7.3", default-features = false }
embedded-io-async = { version = "0.7.0", optional = true }
embedded-io = { version = "0.7.0", optional = true }


[dev-dependencies]
serialport = "4.6"
tokio = { version = "1", features = ["full"] }
tokio-serial = "5.4.4"
embedded-io-adapters = { version = "0.7.0", features = ["tokio-1"] }
embedded-io-async = "0.7.0"
ratatui = "0.30"
crossterm = "0.29"
log = "0.4"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[[example]]
name = "async"
path = "examples/local_async.rs"
required-features = ["embedded_io_async"]
test = false


[[example]]
name = "blocking"
path = "examples/local_blocking.rs"
required-features = ["embedded_io"]
test = false


[[example]]
name = "raw"
path = "examples/local_raw.rs"
# requires libudev installed for USB accesss
test = false

[[example]]
name = "std"
path = "examples/local_std.rs"
# requires libudev installed for USB accesss
test = false

[[example]]
name = "simple"
path = "examples/local_simple.rs"

[[example]]
name = "param_tui"
path = "examples/param_tui.rs"
required-features = ["device"]
test = false

[[example]]
name = "parse_hex"
path = "examples/parse_hex.rs"
test = false

[[example]]
name = "device_manager_demo"
path = "examples/device_manager_demo.rs"
required-features = ["device"]
test = false

[[example]]
name = "mock_parameter_cli"
path = "examples/mock_parameter_cli.rs"
required-features = ["device"]
test = false

[features]
default = ["device"]
"device" = []
"baro-math" = ["dep:libm"]
"defmt" = [
    "dep:defmt",
    "embedded-io-async?/defmt",
    "embedded-io?/defmt",
    "heapless/defmt",
]
"embedded_io_async" = ["dep:embedded-io-async", "dep:embedded-io"]
"embedded_io" = ["dep:embedded-io"]
"logging" = ["dep:log"]
